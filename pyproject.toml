[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "core-v2-nfl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "requests>=2.31,<3",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "streamlit>=1.38,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["core_v2"]
