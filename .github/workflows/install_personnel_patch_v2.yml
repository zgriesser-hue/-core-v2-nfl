name: Install personnel automation patch V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate and install patch files
        shell: bash
        run: |
          echo "Searching repository for the personnel automation ZIP..."
          find . -type f -iname '*.zip' -print
          PATCH_ZIP=$(find . -type f -iname '*personnel*automation*patch*.zip' -print -quit)
          if [ -z "$PATCH_ZIP" ]; then
            echo "Personnel automation ZIP was not found anywhere in the repository."
            exit 1
          fi
          echo "Installing $PATCH_ZIP"
          unzip -o "$PATCH_ZIP"
          rm "$PATCH_ZIP"
          rm -f .github/workflows/install_personnel_patch.yml
          rm -f .github/workflows/install_personnel_patch_v2.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m py_compile app.py parlay_live.py core_v2/*.py scripts/*.py
      - name: Commit validated personnel automation
        shell: bash
        run: |
          git config user.name "core-v2-automation"
          git config user.email "core-v2-automation@users.noreply.github.com"
          git add -A
          git commit -m "feat: automate frozen weekly personnel inputs"
          git push
