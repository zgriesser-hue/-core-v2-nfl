name: Install completed-game dashboard patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install patch files
        run: |
          test -f core_v2_completed_game_patch.zip
          unzip -o core_v2_completed_game_patch.zip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate patch
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m py_compile app.py core_v2/tracking.py scripts/grade_results.py
          python - <<'PY'
          import pandas as pd

          grades = pd.read_csv("game_grades.csv")
          row = grades.loc[grades["game_key"].eq("2026_W1_SF_LA")].iloc[0]
          assert row["away_score"] == 27
          assert row["home_score"] == 7
          assert row["ats_result_at_release"] == "Loss"
          assert row["closing_status"] == "MISSING_NOT_BACKFILLED"
          assert pd.isna(row["clv_points"])
          PY

      - name: Commit validated completed-game update
        run: |
          git config user.name "core-v2-automation"
          git config user.email "core-v2-automation@users.noreply.github.com"
          git rm core_v2_completed_game_patch.zip
          git add app.py core_v2/tracking.py scripts/grade_results.py \
            tests/test_tracking.py game_grades.csv data/tracking/game_grades.csv
          git commit -m "feat: display completed game grades without backfilled close"
          git push
