name: Capture spread and total market history

on:
  schedule:
    # Three daily snapshots. UTC keeps the workflow deterministic year-round.
    - cron: "20 0,12,18 * * *"
  workflow_dispatch:
    inputs:
      minimum_remaining_credits:
        description: Stop before a pull when the last recorded balance is at or below this value
        required: true
        default: "100"

permissions:
  contents: write

concurrency:
  group: core-v2-repository-data-write
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      MINIMUM_REMAINING_CREDITS: ${{ inputs.minimum_remaining_credits || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Validate market code
        run: python -m pytest -q tests/test_market.py
      - name: Resolve current board and capture markets
        shell: bash
        run: |
          TARGET_SEASON=$(python -c "import pandas as pd; print(int(pd.read_csv('current_live_board.csv').iloc[0]['season']))")
          TARGET_WEEK=$(python -c "import pandas as pd; print(int(pd.read_csv('current_live_board.csv').iloc[0]['week']))")
          WEEK_PADDED=$(printf "%02d" "$TARGET_WEEK")
          python -m scripts.refresh_market_history \
            --season "$TARGET_SEASON" \
            --week "$TARGET_WEEK" \
            --board current_live_board.csv \
            --schedule "data/schedules/schedule_${TARGET_SEASON}.csv" \
            --market-dir "data/market/${TARGET_SEASON}/week_${WEEK_PADDED}" \
            --raw-output raw_market_snapshot.json \
            --minimum-remaining-credits "$MINIMUM_REMAINING_CREDITS"
      - name: Preserve raw provider response temporarily
        if: hashFiles('raw_market_snapshot.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: raw-market-${{ github.run_id }}
          path: raw_market_snapshot.json
          retention-days: 14
      - name: Commit append-only history and current snapshots
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- current_book_lines.csv current_openers.csv data/market data/tracking/projection_market_snapshots.csv)" ]; then
            echo "No market-history changes to commit"
            exit 0
          fi
          git config user.name "core-v2-automation"
          git config user.email "core-v2-automation@users.noreply.github.com"
          git add current_book_lines.csv current_openers.csv data/market data/tracking/projection_market_snapshots.csv
          git commit -m "data: append Core V2 spread and total snapshot"
          git push
