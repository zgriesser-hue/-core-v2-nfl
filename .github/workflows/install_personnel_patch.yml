name: Install personnel automation patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install patch files
        shell: bash
        run: |
          test -f core_v2_personnel_automation_patch.zip
          unzip -o core_v2_personnel_automation_patch.zip
          rm core_v2_personnel_automation_patch.zip
          rm .github/workflows/install_personnel_patch.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m py_compile app.py parlay_live.py core_v2/*.py scripts/*.py
      - name: Commit validated personnel automation
        shell: bash
        run: |
          git config user.name "core-v2-automation"
          git config user.email "core-v2-automation@users.noreply.github.com"
          git add -A
          git commit -m "feat: automate frozen weekly personnel inputs"
          git push
