name: Capture pregame closing lines

on:
  schedule:
    # Hourly redundancy. A started worker can wait through missing cron events;
    # it makes no API request until shortly before a scheduled kickoff.
    - cron: "5 * * 1,2,9,10,11,12 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pregame-close-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Capture due pregame closes
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python scripts/capture_pregame_closes.py

      - name: Commit captured close
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/market/ data/tracking/closing_consensus.csv)" ]; then
            echo "No close capture due; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/ data/tracking/closing_consensus.csv
          git commit -m "data: capture pregame closing lines"
          git pull --rebase origin main
          git push origin HEAD:main
