name: Capture pregame closing lines

on:
  schedule:
    # Hourly during NFL season months. The Python guard makes no API request
    # unless a scheduled game is within 75 minutes of kickoff.
    - cron: "5 * * 1,2,9,10,11,12 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pregame-close-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture due pregame closes
        env:
          PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
        run: python scripts/capture_pregame_closes.py

      - name: Commit captured close
        shell: bash
        run: |
          if git diff --quiet -- data/market/; then
            echo "No close capture due; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market/
          git commit -m "data: capture pregame closing lines"
          git pull --rebase origin main
          git push origin HEAD:main
