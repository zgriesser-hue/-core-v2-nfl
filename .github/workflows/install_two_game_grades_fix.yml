name: Install two-game grade fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install corrected grade files
        run: |
          test -f core_v2_two_game_grades_fix.zip
          unzip -o core_v2_two_game_grades_fix.zip

      - name: Validate both completed games
        run: |
          python - <<'PY'
          import csv

          expected = {"2026_W1_NE_SEA", "2026_W1_SF_LA"}
          for path in ["game_grades.csv", "data/tracking/game_grades.csv"]:
              with open(path, newline="") as handle:
                  rows = list(csv.DictReader(handle))
              keys = {row["game_key"] for row in rows}
              if len(rows) != 2 or keys != expected:
                  raise RuntimeError(
                      f"{path} failed validation: rows={len(rows)}, keys={sorted(keys)}"
                  )
              if len(keys) != len(rows):
                  raise RuntimeError(f"{path} contains duplicate game keys")
          print("PASS: NE–SEA and SF–LA are both present in both grade files")
          PY

      - name: Commit corrected grade files
        run: |
          git config user.name "core-v2-automation"
          git config user.email "core-v2-automation@users.noreply.github.com"
          git rm core_v2_two_game_grades_fix.zip
          git add game_grades.csv data/tracking/game_grades.csv
          git commit -m "fix: restore both completed Week 1 grades"
          git push
