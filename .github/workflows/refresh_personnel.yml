name: Refresh weekly personnel

on:
  push:
    branches: [main]
    paths:
      - "data/model/early_availability_*.csv"
      - ".github/workflows/refresh_personnel.yml"
  schedule:
    - cron: "0 14 * * 1,2"
    - cron: "30 20 * * 3,4,5,6"
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: "2026"
      week:
        description: Week number; leave blank to resolve the active week
        required: false

permissions:
  contents: write

concurrency:
  group: core-v2-repository-data-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      TARGET_SEASON: ${{ inputs.season || '2026' }}
      TARGET_WEEK: ${{ inputs.week }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Build frozen personnel layer
        shell: bash
        run: |
          if [ -z "$TARGET_WEEK" ]; then
            TARGET_WEEK=$(python -m scripts.resolve_week --mode active --season "$TARGET_SEASON" --schedule "data/schedules/schedule_${TARGET_SEASON}.csv" --floor-board current_live_board.csv)
          fi
          echo "TARGET_WEEK=$TARGET_WEEK" >> "$GITHUB_ENV"
          WEEK_PADDED=$(printf "%02d" "$TARGET_WEEK")
          OUTPUT_DIR="data/production/${TARGET_SEASON}/week_${WEEK_PADDED}"
          python -m scripts.build_personnel \
            --season "$TARGET_SEASON" \
            --week "$TARGET_WEEK" \
            --schedule "data/schedules/schedule_${TARGET_SEASON}.csv" \
            --roles "data/model/player_role_priors_${TARGET_SEASON}.csv" \
            --v2-role-repairs "data/model/player_role_repairs_v2_${TARGET_SEASON}.csv" \
            --weekly-adjustments "data/model/weekly_team_adjustments_${TARGET_SEASON}.csv" \
            --availability-ledger "data/model/early_availability_${TARGET_SEASON}.csv" \
            --output-dir "$OUTPUT_DIR"
      - name: Validate candidate projection board
        shell: bash
        run: |
          WEEK_PADDED=$(printf "%02d" "$TARGET_WEEK")
          python -m scripts.build_week \
            --season "$TARGET_SEASON" \
            --week "$TARGET_WEEK" \
            --schedule "data/schedules/schedule_${TARGET_SEASON}.csv" \
            --ratings "data/model/team_ratings_${TARGET_SEASON}.csv" \
            --personnel "data/production/${TARGET_SEASON}/week_${WEEK_PADDED}/personnel_adjustments.csv" \
            --locks data/model/historical_projection_locks.csv \
            --output "data/production/${TARGET_SEASON}/week_${WEEK_PADDED}/candidate_projection_board.csv"
      - name: Publish and lock changed projections
        shell: bash
        run: |
          WEEK_PADDED=$(printf "%02d" "$TARGET_WEEK")
          LIVE_WEEK=$(python -c 'import pandas as pd; d=pd.read_csv("current_live_board.csv",usecols=["season","week"]); d=d[pd.to_numeric(d.season,errors="coerce").eq(int(__import__("os").environ["TARGET_SEASON"]))]; print(int(pd.to_numeric(d.week).max()) if not d.empty else 0)')
          if [ "$TARGET_WEEK" -lt "$LIVE_WEEK" ]; then
            echo "Skipping stale week $TARGET_WEEK; live board is already week $LIVE_WEEK"
            exit 0
          fi
          CANDIDATE_BOARD="data/production/${TARGET_SEASON}/week_${WEEK_PADDED}/candidate_dashboard.csv"
          python -m scripts.publish_week \
            --season "$TARGET_SEASON" \
            --week "$TARGET_WEEK" \
            --schedule "data/schedules/schedule_${TARGET_SEASON}.csv" \
            --ratings "data/model/team_ratings_${TARGET_SEASON}.csv" \
            --personnel "data/production/${TARGET_SEASON}/week_${WEEK_PADDED}/personnel_adjustments.csv" \
            --locks data/model/historical_projection_locks.csv \
            --output "$CANDIDATE_BOARD"
          if [ -f current_live_board.csv ] && cmp -s "$CANDIDATE_BOARD" current_live_board.csv; then
            echo "Projection board is unchanged; no market release captured"
            rm "$CANDIDATE_BOARD"
            exit 0
          fi
          mv "$CANDIDATE_BOARD" current_live_board.csv
          cp "data/market/${TARGET_SEASON}/week_${WEEK_PADDED}/dashboard_openers.csv" current_openers.csv
          cp "data/market/${TARGET_SEASON}/week_${WEEK_PADDED}/latest_book_lines.csv" current_book_lines.csv
          python -m scripts.capture_release \
            --season "$TARGET_SEASON" \
            --week "$TARGET_WEEK" \
            --board current_live_board.csv \
            --schedule "data/schedules/schedule_${TARGET_SEASON}.csv" \
            --history data/tracking/projection_releases.csv \
            --dashboard-lines current_book_lines.csv
          python -m scripts.validate_dashboard \
            --board current_live_board.csv \
            --lines current_book_lines.csv \
            --openers current_openers.csv
      - name: Commit personnel and changed release data
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/production current_live_board.csv current_openers.csv current_book_lines.csv data/tracking/projection_releases.csv)" ]; then
            echo "Personnel snapshot and projection board are unchanged"
            exit 0
          fi
          git config user.name "core-v2-automation"
          git config user.email "core-v2-automation@users.noreply.github.com"
          git add data/production current_live_board.csv current_openers.csv current_book_lines.csv data/tracking/projection_releases.csv
          git commit -m "data: refresh personnel and publish changed projections"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push changed while personnel was building; rebasing attempt $attempt"
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not publish personnel after three push attempts"
          exit 1
