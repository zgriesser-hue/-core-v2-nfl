name: Grade completed games

on:
  schedule:
    - cron: "30 12 * * 1-3"
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: "2026"

permissions:
  contents: write

concurrency:
  group: core-v2-result-grading
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    env:
      TARGET_SEASON: ${{ inputs.season || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Import final scores and append grades
        run: |
          python -m scripts.grade_results \
            --season "$TARGET_SEASON" \
            --releases data/tracking/projection_releases.csv \
            --closings data/tracking/closing_consensus.csv \
            --history data/tracking/game_grades.csv \
            --dashboard-output game_grades.csv
      - name: Update power ratings through latest fully graded week
        run: |
          python -m scripts.update_ratings \
            --season "$TARGET_SEASON" \
            --schedule "data/schedules/schedule_${TARGET_SEASON}.csv" \
            --grades data/tracking/game_grades.csv \
            --ratings "data/model/team_ratings_${TARGET_SEASON}.csv" \
            --include-partial-latest-week
      - name: Commit new grades and ratings
        shell: bash
        run: |
          if [ -z "$(git status --porcelain data/tracking/game_grades.csv game_grades.csv data/model/team_ratings_${TARGET_SEASON}.csv)" ]; then
            echo "No newly completed games or rating changes"
            exit 0
          fi
          git config user.name "core-v2-automation"
          git config user.email "core-v2-automation@users.noreply.github.com"
          git add data/tracking/game_grades.csv game_grades.csv "data/model/team_ratings_${TARGET_SEASON}.csv"
          git commit -m "data: grade games and update Core V2 ratings"
          git push
