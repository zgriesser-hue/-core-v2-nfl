name: Capture pre-kickoff closing lines

on:
  schedule:
    # Frequent only around normal NFL kickoff windows. The script checks the
    # schedule before contacting ParlayAPI, so idle runs use zero API credits.
    - cron: "*/15 23 * * 3,4,6"
    - cron: "*/15 0,1 * * 0,4,5"
    - cron: "*/15 12-21 * * 0"
    - cron: "*/15 23 * * 0,1"
    - cron: "*/15 0,1 * * 1,2"
  workflow_dispatch:
    inputs:
      season:
        description: NFL season
        required: true
        default: "2026"
      week:
        description: Week number; leave blank to resolve the active week
        required: false
      force:
        description: Capture all uncovered future games now
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: core-v2-closing-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}
      TARGET_SEASON: ${{ inputs.season || '2026' }}
      TARGET_WEEK: ${{ inputs.week }}
      FORCE_CAPTURE: ${{ inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Capture uncovered games inside the pre-kickoff window
        shell: bash
        run: |
          if [ -z "$TARGET_WEEK" ]; then
            TARGET_WEEK=$(python -m scripts.resolve_week \
              --season "$TARGET_SEASON" \
              --schedule "data/schedules/schedule_${TARGET_SEASON}.csv" \
              --mode active) || {
                echo "No active regular-season week; nothing to capture"
                exit 0
              }
          fi
          WEEK_PADDED=$(printf "%02d" "$TARGET_WEEK")
          FORCE_ARG=""
          if [ "$FORCE_CAPTURE" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python -m scripts.capture_closings \
            --season "$TARGET_SEASON" \
            --week "$TARGET_WEEK" \
            --schedule "data/schedules/schedule_${TARGET_SEASON}.csv" \
            --output-dir "data/market/${TARGET_SEASON}/week_${WEEK_PADDED}" \
            --tracking-consensus data/tracking/closing_consensus.csv \
            $FORCE_ARG
      - name: Commit immutable closing records
        shell: bash
        run: |
          if [ -z "$(git status --porcelain data/market data/tracking)" ]; then
            echo "No new closing records"
            exit 0
          fi
          git config user.name "core-v2-automation"
          git config user.email "core-v2-automation@users.noreply.github.com"
          git add data/market data/tracking/closing_consensus.csv
          git commit -m "data: capture Core V2 closing lines"
          git push

