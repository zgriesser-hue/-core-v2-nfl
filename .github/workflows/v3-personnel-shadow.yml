name: V3 personnel historical shadow test

on:
  workflow_dispatch:
    inputs:
      panel_path:
        description: "Repo path to historical V3 personnel game panel"
        required: true
        default: "data/research/v3/v3_personnel_historical_panel.csv"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Validate historical panel
        run: |
          test -f "${{ inputs.panel_path }}" || (echo "Historical panel not found: ${{ inputs.panel_path }}" && exit 2)
      - name: Run shadow specifications
        run: |
          python scripts/test_v3_personnel_specs.py \
            --panel "${{ inputs.panel_path }}" \
            --out data/research/v3/personnel_shadow_results.csv
      - name: Commit research result
        run: |
          if git diff --quiet -- data/research/v3/personnel_shadow_results.csv; then
            echo "No result changes"
            exit 0
          fi
          git config user.name "v3-research-automation"
          git config user.email "v3-research-automation@users.noreply.github.com"
          git add data/research/v3/personnel_shadow_results.csv
          git commit -m "research: update V3 personnel shadow results"
          git push
